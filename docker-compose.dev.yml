services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ip_deputy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=uk-UA"
    ports:
      - "5432:5432"
    volumes:
      - ip-deputy-postgres:/var/lib/postgresql/data

volumes:
  ip-deputy-postgres:
